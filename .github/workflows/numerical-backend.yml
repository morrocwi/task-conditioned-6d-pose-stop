name: numerical-backend-reproduction

on:
  push:
    paths:
      - 'experiments/**'
      - 'theory/**'
      - 'evidence/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'reproduce.py'
      - '.github/workflows/numerical-backend.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit and evidence controls
        run: |
          python -m unittest discover -s tests -v
          python evidence/validate_claim_card.py
          python theory/completion_envelope.py
      - name: Reproduce numerical backend (CI profile)
        run: python experiments/numerical_icp.py --profile ci --out-dir artifacts/numerical
      - name: Reproduce calibrated completion envelope (CI profile)
        run: python experiments/conformal_completion.py --profile ci --out-dir artifacts/conformal
      - name: Check evidence boundaries
        shell: python
        run: |
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/numerical/numerical_icp.json').read_text())
          b=d['evidence_boundary']
          assert d['label']=='[NumericalBackend]'
          assert b['rigid_registration_executed'] is True
          assert b['gate_has_hidden_ground_truth_access'] is False
          assert b['camera_executed'] is False
          assert b['neural_pose_model_executed'] is False
          assert b['physical_robot_executed'] is False

          c=json.loads(Path('artifacts/conformal/conformal_completion.json').read_text())
          e=c['evidence_boundary']
          assert c['label']=='[NumericalBackend+SplitCalibration]'
          assert c['method']=='trajectory_level_split_conformal_completion_envelope'
          assert e['iterative_rigid_registration_executed'] is True
          assert e['hidden_ground_truth_used_online_by_gate'] is False
          assert e['camera_executed'] is False
          assert e['neural_pose_model_executed'] is False
          assert e['physical_robot_executed'] is False
          assert 0.0 <= c['evaluation']['in_distribution']['trajectory_envelope_coverage'] <= 1.0
          print('evidence boundaries: PASS')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-backend-${{ matrix.os }}
          path: |
            artifacts/numerical/
            artifacts/conformal/
